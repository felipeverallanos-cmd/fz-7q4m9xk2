                margin: 0 0 15px;

            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #0f766e;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;

                background: #0f766e;
                filter: brightness(92%);

                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {

                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;

                margin-top: -1em;
                margin-bottom: 1em;
            }

                font-size: 1.5em;
            }

                display: flex;
                align-items: center;
                margin-bottom: 1em;

                margin-right: 1em;

                align-items: center;
                justify-content: center;

                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;

                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;

                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;

                    font-size: 16px;
                }
